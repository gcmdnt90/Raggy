[theme]
primaryColor = "#0077B6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
address = "0.0.0.0"
# Disables the hot-reload file watcher that spams 'torchvision not found'
# warnings when sentence-transformers/transformers is loaded.
fileWatcherType = "none"

[logger]
# Streamlit's own log level — suppresses its internal warnings to console.
level = "error"
messageFormat = "%(asctime)s %(levelname)s — %(message)s"
