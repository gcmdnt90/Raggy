[pytest]
testpaths = tests
markers =
    integration: tests that require external services or slower local resources

# Keep a run's temporary directories only when something failed, and keep one
# run's worth. Banco is delivered on Windows: the default (three runs, kept
# whatever the outcome) leaves hundreds of numbered directories under
# %TEMP%\pytest-of-<user>, and pytest's own sweep of them has already failed
# there with `PermissionError: [WinError 5]` on the `pytest-current` junction —
# after every test had passed, which reads as a broken suite.
#
# If that error appears anyway, the fix is to delete %TEMP%\pytest-of-<user>
# once; it is a stale junction from an earlier run, not a defect in the tests.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
