[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "raggy"
version = "0.2.0"
description = "Self-hosted RAG knowledge assistant"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
    "streamlit>=1.62,<2",
    "qdrant-client>=1.19,<2",
    "anthropic>=1.2,<2",
    "openai>=3.6,<4",
    "google-genai>=2.21,<3",
    "sentence-transformers>=6.0,<7",
    "pdfplumber>=0.11.10,<0.12",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "python-dotenv>=1.2.3,<2",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "PyYAML>=6.0.3,<7",
    "Jinja2>=3.1.6,<4",
    "psutil>=7.2.2,<8",
    "requests>=2.34.2,<3",
    "packaging>=26.3,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.5,<0.17",
    "pip-audit>=2.10.1,<3",
    "pip-tools>=7.6.1,<8",
    "build>=1.6,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that require external services or slower local resources"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", ".venv", "knowledge_base"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

