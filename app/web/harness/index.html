<!doctype html>

<title>Banco</title>

<!-- THE PROJECTED SURFACE.
     Nothing rendered here may contain an API key, a client name, a ground-truth
     file, or a trainer note. See AGENTS.md rule 2. Trainer material is stripped
     server-side in app/server/demos.py; do not re-add it client-side.

     Everything on this page is read from the server. The page holds no prompt
     text of its own (docs/adr/0001) and never fabricates model output: a pane
     that cannot run says so (AGENTS.md rule 1).

     The static text below is written in Italian, which is the default language:
     the page must read correctly before i18n.js has run. `data-i18n` keys swap
     it for the other language. See app/web/shared/i18n.js. -->

<header id="bar">
  <span class="brand"><span class="brand-mark" aria-hidden="true">B</span>Banco</span>

  <label class="field">
    <span data-i18n="harness.sector">settore</span>
    <select id="sector" data-i18n-aria-label="harness.sector_aria" aria-label="Settore"></select>
  </label>

  <span id="profile" class="chip"
        data-i18n-title="harness.profile_title"
        title="ricavato da ciò che questa macchina raggiunge davvero"></span>

  <!-- The egress indicator is an instrument, not decoration: without it D5-A's
       network-off gesture proves nothing. See PROJECT.md invariant 4. -->
  <span id="egress" class="chip egress"
        data-i18n-title="harness.egress_title" title="dove sono andate le chiamate">
    <span class="egress-label" data-i18n="harness.egress_label">egress</span>
    <span id="egress-targets">—</span>
  </span>

  <span id="mode" class="chip mode" hidden></span>

  <!-- The language switch is on the projected surface on purpose: a room that
       does not read Italian must be able to change it without leaving the
       projector, and the trainer must never have to reach for the console
       mid-lesson. It carries no state of its own beyond the choice itself. -->
  <label class="field lang">
    <span data-i18n="common.language">lingua</span>
    <select id="lang" data-lang-select
            data-i18n-aria-label="common.language_aria" aria-label="Lingua dell'interfaccia">
      <option value="it">Italiano</option>
      <option value="en">English</option>
    </select>
  </label>
</header>

<main>
  <section id="left">
    <p class="section-label" data-i18n="harness.demonstrations">Dimostrazioni</p>
    <nav id="demos" data-i18n-aria-label="harness.demos_aria" aria-label="dimostrazioni"></nav>

    <p class="section-label beats-label" data-i18n="harness.current_sequence">Sequenza corrente</p>
    <ol id="beats" data-i18n-aria-label="harness.beats_aria" aria-label="beat"></ol>
  </section>

  <section id="right">
    <p id="banner" class="banner" hidden></p>

    <div id="detail" hidden>
      <div class="beat-heading">
        <p id="teaches"></p>
        <p id="blocked" class="blocked" hidden></p>
        <button id="run" type="button" data-i18n="harness.run">Esegui</button>
        <button id="gear" type="button" class="icon" aria-expanded="false"
                data-i18n-title="harness.gear_title" title="fonti del modello">&#9881;</button>
        <button id="reset-run" type="button" class="secondary" hidden
                data-i18n="harness.reset_run">Azzera questo beat</button>
      </div>
      <div id="gear-panel" hidden></div>
      <details id="prompt-box">
        <summary id="prompt-summary" data-i18n="harness.prompt_summary">il prompt come inviato</summary>
        <pre id="prompt"></pre>
        <button id="prompt-open" type="button" class="secondary"
                data-i18n="harness.open_prompt">Apri e modifica</button>
      </details>
    </div>

    <div id="panes"></div>
  </section>
</main>

<!-- The viewer. One overlay for every "look at this properly" on the harness:
     a pane full-page, the prompt (editable, for the next run only), and any
     document a pane put in front of the question. It is the same controls in
     all three cases because it is the same gesture, and a room should not have
     to learn two ways to make text bigger. -->
<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <header>
    <span id="viewer-title"></span>
    <span id="viewer-note" class="viewer-note"></span>
    <span class="viewer-controls">
      <button id="viewer-smaller" type="button" data-i18n-title="harness.viewer_smaller"
              title="più piccolo">A&minus;</button>
      <button id="viewer-bigger" type="button" data-i18n-title="harness.viewer_bigger"
              title="più grande">A+</button>
      <button id="viewer-close" type="button" data-i18n="harness.viewer_close">Torna alla panoramica</button>
    </span>
  </header>
  <pre id="viewer-body" tabindex="0"></pre>
  <textarea id="viewer-edit" hidden spellcheck="false"></textarea>
</div>

<script src="/static/shared/strings.it.js"></script>
<script src="/static/shared/strings.en.js"></script>
<script src="/static/shared/i18n.js"></script>
